  - name: rules/ecc/typescript/hooks.md
    vendored: ecc
  - name: rules/ecc/typescript/patterns.md
    vendored: ecc
  - name: rules/ecc/typescript/security.md
    vendored: ecc
  - name: rules/ecc/typescript/testing.md
    vendored: ecc

output_styles:
