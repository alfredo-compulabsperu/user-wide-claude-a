  # `vendored` is inert to sync (it reads only `name`) — documentation for drift recovery.
  - name: ecc/common/git-workflow.md
    vendored: ecc
  - name: ecc/common/hooks-todowrite-practices.md
    vendored: ecc

# Hook scripts registered under `hooks.<Event>` in ~/.claude/settings.json.
# Only the live, registered ones; the two per-edit injectors are retired in Phase 2.
hooks:
  - name: check-mcp-gitignore.py
    executable: true
  - name: check-settings-json-secrets.sh
    executable: true
  - name: context-mode-cache-heal.mjs
    executable: true
  - name: context-mode-check.js
  - name: enterplanmode-rule-inject.py
    executable: true
  - name: noop-bash-guard.py
    executable: true
  - name: research-ops-promptsubmit.py
    executable: true
  - name: research-ops-rule-inject.py
    executable: true
  - name: research-ops-tooling-gate.py
    executable: true

# Lazy-loaded rule bodies (~/.claude/lazy/). Names carry the nested path; sync's
# install_file mkdir -p's the parent, so depth is fine.
lazy:
  - name: rules/ask-before-test-changes.md
  - name: rules/claude-md-self-reference.md
  - name: rules/coding-principles.md
  - name: rules/command-scripts.md
  - name: rules/hook-path-convention.md
  - name: rules/plan.md
  - name: rules/research-ops.md
  - name: rules/two-pass-artifacts.md
